name: Deploy Backend

on:
  push:
    branches: [ publish ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR (skip tests)
        run: mvn clean package -DskipTests

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          OPT="-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"

          # 배포 스크립트 생성
          cat > run-deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          mkdir -p /home/ubuntu/app/logs /home/ubuntu/uploads
          cd /home/ubuntu/app
          echo "[1] DB 기동..."
          docker compose up -d
          echo "[2] systemd 서비스 설치/갱신..."
          sudo tee /etc/systemd/system/app.service > /dev/null << 'SERVICE'
          [Unit]
          Description=YamYam Spring Backend
          Requires=docker.service
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/app
          EnvironmentFile=/home/ubuntu/app/.env
          Environment="JAVA_OPTS=-Xms256m -Xmx384m -XX:+UseG1GC"
          ExecStart=/usr/bin/java $JAVA_OPTS -Dspring.profiles.active=prod -jar /home/ubuntu/app/app.jar
          SuccessExitStatus=143
          Restart=always
          RestartSec=5
          StandardOutput=append:/home/ubuntu/app/logs/app.log
          StandardError=append:/home/ubuntu/app/logs/app.log

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable app

          echo "[3] 기존 서비스/직접 실행 프로세스 정리..."
          sudo systemctl stop app 2>/dev/null || true
          pkill -f "java .*app.jar" 2>/dev/null || true
          sleep 2

          echo "[4] 앱 재시작..."
          sudo systemctl restart app
          sleep 10
          if sudo systemctl is-active --quiet app; then
            echo "✅ Backend is running"
            sudo systemctl --no-pager --full status app
          else
            echo "❌ Backend failed - status:"
            sudo systemctl --no-pager --full status app || true
            echo "❌ Last 80 log lines:"
            journalctl -u app -n 80 --no-pager || true
            exit 1
          fi
          SCRIPT

          # AWS 환경변수를 EC2 systemd EnvironmentFile로 저장 (git에 커밋되지 않음)
          ssh -i key.pem $OPT ubuntu@$HOST "cat > /home/ubuntu/app/.env << 'ENVEOF'
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          S3_BUCKET=${S3_BUCKET}
          ENVEOF
          chmod 600 /home/ubuntu/app/.env"

          # 파일 전송 (JAR은 app.jar 이름으로 덮어씀)
          scp -i key.pem $OPT \
            target/yamyam-backend-0.0.1-SNAPSHOT.jar \
            ubuntu@$HOST:/home/ubuntu/app/app.jar
          scp -i key.pem $OPT \
            docker-compose.yml \
            run-deploy.sh \
            ubuntu@$HOST:/home/ubuntu/app/

          # 배포 실행
          ssh -i key.pem $OPT ubuntu@$HOST 'bash /home/ubuntu/app/run-deploy.sh'

          rm -f key.pem run-deploy.sh
