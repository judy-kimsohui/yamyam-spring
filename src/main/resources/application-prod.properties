# ==========================================
# 데이터베이스 (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/yamyamdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# MongoDB (채팅)
# ==========================================
spring.data.mongodb.uri=mongodb://localhost:27017/yamyamdb

# ==========================================
# S3 (환경변수로 주입: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET)
# ==========================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.s3.bucket=${S3_BUCKET}
cloud.aws.region.static=ap-northeast-2

# ==========================================
# 동영상 업로드 (S3 스트림, 임시 공간만 사용)
# ==========================================
spring.servlet.multipart.location=/home/ubuntu/uploads
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ==========================================
# 로그
# ==========================================
logging.level.com.ssafy=info
