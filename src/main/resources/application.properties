spring.application.name=yamyam-backend

logging.level.com.ssafy=trace
logging.pattern.console=%d{HH:mm:ss} [%level] %c{36} %m%n

# ==========================================
# 뷰 리졸버 설정
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ==========================================
# 데이터베이스 (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3307/yamyamdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# MongoDB (채팅)
# ==========================================
spring.data.mongodb.uri=mongodb://localhost:27017/yamyamdb

# ==========================================
# 동영상 업로드
# ==========================================
# dev: 로컬 static 폴더에 저장 / prod: 아래 주석 해제 후 경로 변경
#yamyam.video.upload-dir=${user.home}/uploads/videos
yamyam.video.upload-dir=src/main/resources/static/videos
spring.servlet.multipart.location=${user.home}/uploads
spring.servlet.multipart.file-size-threshold=10MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==========================================
# MyBatis
# ==========================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# ==========================================
# JWT
# ==========================================
# 주의: secret은 최소 32자(256비트) 이상 권장
jwt.secret=vAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmYvAmY
# 만료 시간: 86400000ms = 24시간
jwt.expiration=86400000

# ==========================================
# Spring AI - OpenAI
# ==========================================
spring.ai.openai.api-key=S15P02AM06-d567cf77-e1a1-46c0-92b2-dbad03b22e6a
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com
spring.ai.openai.chat.options.model=gpt-4o

# ==========================================
# 불필요한 자동설정 제외
# ==========================================
spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
