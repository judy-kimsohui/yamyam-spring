
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS {
    bigint id PK
    string username
    string email
    string password_hash
    string profile_image_url
    datetime created_at
  }

  GROUPS {
    bigint id PK
    string name
    string invite_code
    bigint created_by FK
    datetime created_at
  }

  GROUP_MEMBERS {
    bigint id PK
    bigint group_id FK
    bigint user_id FK
    string role
    datetime joined_at
  }

  USER_GOALS {
    bigint id PK
    bigint user_id FK
    bigint group_id FK
    int target_calories
    int target_protein_g
    int target_carb_g
    int target_fat_g
    date start_date
    date end_date
  }

  MEAL_SCHEDULES {
    bigint id PK
    bigint group_id FK
    string meal_type
    time scheduled_time
    int record_deadline_min
  }

  MEAL_RECORDS {
    bigint id PK
    bigint user_id FK
    bigint group_id FK
    bigint schedule_id FK
    string meal_type
    string video_url
    int total_calories
    int protein_g
    int carb_g
    int fat_g
    int sodium_mg
    int fiber_g
    string ai_comment
    datetime recorded_at
  }

  RECOGNIZED_FOODS {
    bigint id PK
    bigint meal_record_id FK
    string food_name
    int calories
    float portion_size
  }

  REACTIONS {
    bigint id PK
    bigint meal_record_id FK
    bigint user_id FK
    string emoji
    datetime created_at
  }

  CHAT_MESSAGES {
    bigint id PK
    bigint group_id FK
    bigint user_id FK
    string content
    datetime sent_at
  }

  NOTIFICATIONS {
    bigint id PK
    bigint user_id FK
    bigint group_id FK
    string type
    string message
    boolean is_read
    datetime sent_at
  }

  USERS ||--o{ GROUP_MEMBERS : "참여"
  GROUPS ||--o{ GROUP_MEMBERS : "포함"
  USERS ||--o{ USER_GOALS : "설정"
  GROUPS ||--o{ USER_GOALS : "기준"
  GROUPS ||--o{ MEAL_SCHEDULES : "정의"
  USERS ||--o{ MEAL_RECORDS : "기록"
  GROUPS ||--o{ MEAL_RECORDS : "소속"
  MEAL_SCHEDULES ||--o{ MEAL_RECORDS : "연결"
  MEAL_RECORDS ||--o{ RECOGNIZED_FOODS : "포함"
  MEAL_RECORDS ||--o{ REACTIONS : "받음"
  USERS ||--o{ REACTIONS : "남김"
  GROUPS ||--o{ CHAT_MESSAGES : "채널"
  USERS ||--o{ CHAT_MESSAGES : "발송"
  USERS ||--o{ NOTIFICATIONS : "수신"
  GROUPS ||--o{ NOTIFICATIONS : "트리거"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
